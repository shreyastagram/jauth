# ============================================================
# PRODUCTION CONFIGURATION - Neon PostgreSQL
# ============================================================
# Start with: ./run.sh        (uses prod profile by default)
#         or: ./run.sh prod
#
# Environment variables are loaded from .env file by run.sh
# ============================================================

spring:
  application:
    name: auth-service
  
  # PostgreSQL Database Configuration (Neon)
  # JDBC URL is built from separate components in .env:
  # DATABASE_HOST, DATABASE_NAME, DATABASE_USERNAME, DATABASE_PASSWORD
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}/${DATABASE_NAME}?sslmode=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
    # Connection pool (HikariCP). minimum-idle=0 and no keepalive let idle
    # connections drain so Neon compute can autosuspend (scale-to-zero) when
    # there is no traffic. A keepalive/test-query on idle connections would ping
    # Neon continuously and prevent autosuspend.
    hikari:
      maximum-pool-size: 25
      minimum-idle: 0
      idle-timeout: 60000         # close idle connections after 60s
      connection-timeout: 30000   # allow time for Neon to resume from autosuspend
      max-lifetime: 300000        # 5 minutes
      validation-timeout: 5000
      leak-detection-threshold: 30000
  
  # Disable H2 Console in production
  h2:
    console:
      enabled: false
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      # Temporary unblock: allow missing OTP tables to be created automatically.
      # Revert to 'validate' after schema migration is applied.
      ddl-auto: update
    show-sql: false               # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false
    open-in-view: false

  # OAuth2 Client Configuration (Google)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: '{baseUrl}/oauth2/callback/google'
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email


# JWT Configuration
jwt:
  # IMPORTANT: Use a strong, unique secret in production!
  # Generate with: openssl rand -base64 64
  secret: ${JWT_SECRET}
  expiration:
    ms: 86400000  # 24 hours
  issuer: fixhomi-auth-service
  refresh-token:
    expiration:
      days: 60   # ~2 months. Safe because tokens rotate on every refresh and are
                 # revoked server-side on logout/delete. See note in AUTH doc.
    rotation-grace-seconds: 45  # Window in which a just-rotated token returns its successor instead of 401

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# Disable Swagger/OpenAPI in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging Configuration (reduced for production)
logging:
  level:
    '[com.fixhomi.auth]': INFO
    '[org.springframework.security]': WARN
    '[org.hibernate.SQL]': WARN
    root: INFO

# FixHomi Application Configuration
fixhomi:
  # CORS configuration for production
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://app.fixhomi.com,https://api.fixhomi.com}
  
  # Backend services URLs
  backend:
    nodejs-url: ${NODEJS_BACKEND_URL}
  
  verification:
    otp:
      expiration-minutes: 5
      max-attempts: 3
      length: 6
      rate-limit-minutes: 5
      rate-limit-max-requests: 3
    email:
      expiration-hours: 24
      rate-limit-minutes: 5
      # Use production URL for email verification links
      base-url: ${FIXHOMI_BASE_URL:https://auth.fixhomi.com}
    password-reset:
      expiration-hours: 1
      rate-limit-minutes: 5
      base-url: ${FIXHOMI_FRONTEND_URL:https://auth.fixhomi.com}
  
  notification:
    email:
      # Use 'stub' for testing, 'brevo' for production emails
      provider: ${EMAIL_PROVIDER:stub}
      brevo:
        api-key: ${BREVO_API_KEY:}
        sender-email: ${BREVO_SENDER_EMAIL:noreply@fixhomi.com}
        sender-name: ${BREVO_SENDER_NAME:FixHomi}
    sms:
      # Use 'stub' for testing, 'msg91' for production SMS
      provider: ${SMS_PROVIDER:stub}
      msg91:
        auth-key: ${MSG91_AUTH_KEY:}
        template-id: ${MSG91_TEMPLATE_ID:}
        verification-template-id: ${MSG91_VERIFICATION_TEMPLATE_ID:}
        delete-template-id: ${MSG91_DELETE_TEMPLATE_ID:}
        sender-id: ${MSG91_SENDER_ID:}
